; Color palette is owned by the theme switcher — see colors.ini.
; This file is user-owned: layout, fonts, modules. Don't put hex colors
; here — only colors.ini is rewritten when the theme changes.
include-file = colors.ini


[bar/example]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
radius = 6

; dpi = 96
; HiDPI/4K: polybar auto-detects dpi and its pt sizes scale with it. If the
; bar still looks small after enabling the HiDPI block in bspwmrc, pin it to
; match Xft.dpi, e.g. dpi = 192.

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

; separator = |
; separator-foreground = ${colors.disabled}

#font-0 = JetBrainsMono Nerd Font:size=12.5:weight=medium;3
font-0 = Roboto Mono Nerd Font:size=12;4
font-1 = FontAwesome:size=12;4

modules-left = xworkspaces sep xwindow
modules-center =
modules-right = filesystem sep pulseaudio sep memory sep cpu sep date sep hour sep lock screenshot powermenu tray

fixed-center = true

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = bspwm

; override-redirect = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name:2%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name:2%
label-occupied-padding = 1

label-urgent = %name:2%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name:2%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/sep]
type = custom/text
content = |
content-foreground = ${colors.disabled}

[module/xwindow]
type = internal/xwindow
label = %title:0:100:...%
label-foreground = ${colors.foreground}

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#D29922}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/lock]
type = internal/xkeyboard
;ignore :
format-margin = 0
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-indicator>
label-indicator-padding = 0
indicator-icon-0 = caps lock;-CL;+CL
label-indicator-off =
label-indicator-on = "  Caps "
format-foreground = ${colors.background}
format-background = ${colors.alert}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

;;;;;;;;;;;;;;;; CENTER MODULES ;;;;;;;;;;;;;;;;

[module/hour]
type = internal/date
interval = 1
date = %l:%M %p
date-alt = %Y-%m-%d %l:%M:%S %p
label = %date%
label-foreground = ${colors.primary}

[module/date]
type = custom/script
interval = 60
format = <label>
exec = date +"%a %b %-d"
click-left = gsimplecal

[module/tray]
type = internal/tray
tray-spacing = 4px

[module/screenshot]
type = custom/text
content = 󰻛
content-foreground = ${colors.secondary}
click-left = flameshot gui

[module/powermenu]
type = custom/text
content = 󰐥
content-foreground = ${colors.alert}
click-left = ~/.config/jag-quickshell/scripts/power

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
